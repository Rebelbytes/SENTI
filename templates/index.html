<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>YouTube Sentiment Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f7f7f7;
        }

        .container {
            margin-top: 100px;
        }

        .card {
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card mx-auto" style="max-width: 600px;">
            <h2 class="text-center mb-4">YouTube Sentiment Analysis</h2>
            <form action="{{ url_for('analyze') }}" method="post">
                <div class="mb-3">
                    <label for="video_id" class="form-label">Enter YouTube Video Link:</label>
                    <input type="text" class="form-control" id="video_id" name="video_id"
                        placeholder="https://www.youtube.com/watch?v=...">
                </div>
                <button type="submit" class="btn btn-primary w-100">Analyze</button>
            </form>
        </div>
    </div>
</body>

</html>
